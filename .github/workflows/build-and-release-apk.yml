name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Phiên bản phát hành (ví dụ: v1.2.4)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    name: Build Synchronized APK & Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập JDK 21 (Tương thích Gradle 9.3.1 & AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Cấu hình Android SDK có sẵn trên Runner (API 36)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDKMANAGER" --install "platforms;android-36.1" || true
          fi

      - name: 4. Thiết lập Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 5. Đồng bộ Chữ ký số AI Studio & Firebase Google Sign-In (SHA-1 AA:25:0A:E0...)
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Khôi phục google-services.json để Google Sign-In (default_web_client_id) luôn hoạt động trên máy thật
          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.base64 ]; then
            tr -d '[:space:]' < app/google-services.json.base64 | base64 -d > app/google-services.json
            echo "Đã khôi phục app/google-services.json từ app/google-services.json.base64"
          fi

          # Khôi phục chính xác Keystore gốc của AI Studio (SHA-1: AA:25:0A:E0:7E:59:92:5D:A3:EE:02:5C:0E:0A:16:5C:85:3F:30:2A)
          SYNCED_KEYSTORE_B64=""

          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Đã khôi phục debug.keystore từ debug.keystore.base64"
          elif [ -f gradle/signing-sync.txt ]; then
            tr -d '[:space:]' < gradle/signing-sync.txt | base64 -d > debug.keystore
            echo "Đã khôi phục debug.keystore từ gradle/signing-sync.txt"
          elif [ -n "$KEYSTORE_BASE64_SECRET" ]; then
            echo "$KEYSTORE_BASE64_SECRET" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Đã khôi phục debug.keystore từ GitHub Secret KEYSTORE_BASE64"
          else
            echo "$SYNCED_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Đã khôi phục debug.keystore đồng bộ trực tiếp với AI Studio & Firebase"
          fi

          # Đồng bộ sang my-upload-key.jks (alias: upload) để bản Release và Debug có CÙNG 1 CHỮ KÝ SỐ
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -destkeystore my-upload-key.jks \
            -srcstorepass android \
            -deststorepass android \
            -srckeypass android \
            -destkeypass android \
            -srcalias androiddebugkey \
            -destalias upload \
            -noprompt

          echo "=== Kiểm tra dấu vân tay chữ ký số (SHA-1 & SHA-256) ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: 6. Tự động nâng phiên bản mới (1.1 -> 1.2.${{ github.run_number }}) & Biên dịch APK
        id: build_apk
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36.1" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts || true
          fi

          # Đọc phiên bản gốc (1.1) và tự động cộng tăng dần thành 1.2.<run_number> (ví dụ: 1.2.4)
          BASE_VER=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts || echo "1.1")
          MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
          MINOR=$(echo "$BASE_VER" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEXT_MINOR}.${{ github.run_number }}"
          NEW_CODE=$((100 + ${{ github.run_number }}))

          echo "Phiên bản gốc: $BASE_VER -> Phiên bản mới tự động: $NEW_VERSION (versionCode: $NEW_CODE)"
          echo "app_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "app_version_code=$NEW_CODE" >> $GITHUB_OUTPUT

          gradle assembleRelease assembleDebug --no-daemon

      - name: 7. Xác thực chữ ký APK, tạo mã băm SHA-256 chống chỉnh sửa & Chuẩn bị file phát hành
        id: pack_apk
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${{ steps.build_apk.outputs.app_version }}"
          fi

          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          FINAL_REL="LichVanNien-${TAG_NAME}-release-signed.apk"
          FINAL_DBG="LichVanNien-${TAG_NAME}-debug-signed.apk"

          cp "$REL_APK" "$FINAL_REL"
          cp "$DBG_APK" "$FINAL_DBG"

          # Dấu vân tay chứng chỉ ký APK (Signing Certificate SHA-1 & SHA-256)
          CERT_SHA1=$(keytool -printcert -jarfile "$FINAL_REL" | grep -E "SHA1:|SHA-1:" | head -n 1 | awk '{print $2}')
          CERT_SHA256=$(keytool -printcert -jarfile "$FINAL_REL" | grep -E "SHA256:|SHA-256:" | head -n 1 | awk '{print $2}')

          # Mã băm toàn vẹn file APK (File Integrity SHA-256 Checksum)
          FILE_REL_SHA256=$(sha256sum "$FINAL_REL" | awk '{print $1}')
          FILE_DBG_SHA256=$(sha256sum "$FINAL_DBG" | awk '{print $1}')

          echo "$FILE_REL_SHA256  $FINAL_REL" > "${FINAL_REL}.sha256"
          echo "$FILE_DBG_SHA256  $FINAL_DBG" > "${FINAL_DBG}.sha256"

          cat > version-manifest.json <<EOF
          {
            "versionName": "${{ steps.build_apk.outputs.app_version }}",
            "versionCode": ${{ steps.build_apk.outputs.app_version_code }},
            "tagName": "${TAG_NAME}",
            "apkFileName": "${FINAL_REL}",
            "apkFileSha256": "${FILE_REL_SHA256}",
            "signingCertificateSha1": "${CERT_SHA1}",
            "signingCertificateSha256": "${CERT_SHA256}"
          }
          EOF

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "rel_apk=$FINAL_REL" >> $GITHUB_OUTPUT
          echo "dbg_apk=$FINAL_DBG" >> $GITHUB_OUTPUT
          echo "apk_sha1=$CERT_SHA1" >> $GITHUB_OUTPUT
          echo "apk_sha256=$CERT_SHA256" >> $GITHUB_OUTPUT
          echo "file_rel_sha256=$FILE_REL_SHA256" >> $GITHUB_OUTPUT
          echo "file_dbg_sha256=$FILE_DBG_SHA256" >> $GITHUB_OUTPUT

      - name: 8. Lưu trữ APK & SHA-256 trên GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LichVanNien-Signed-APKs-${{ steps.pack_apk.outputs.tag_name }}
          path: |
            ${{ steps.pack_apk.outputs.rel_apk }}
            ${{ steps.pack_apk.outputs.dbg_apk }}
            *.sha256
            version-manifest.json

      - name: 9. Tự động tạo bản phát hành trên GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack_apk.outputs.tag_name }}
          name: "Lịch Vạn Niên ${{ steps.pack_apk.outputs.tag_name }} (Signed APK)"
          body: |
            ## 🏮 Lịch Vạn Niên - Bản phát hành ${{ steps.pack_apk.outputs.tag_name }}
            File APK đã được tự động biên dịch và **đồng bộ 100% chữ ký số (Signing Certificate)** giữa bản Release, bản Debug, AI Studio và Firebase Google Sign-In.

            ### 🔐 Chữ ký số chứng thực nhà phát triển (Signing Certificate)
            - **Package Name:** `com.aistudio.lichvannien.vnkpxr`
            - **Certificate SHA-1:** `${{ steps.pack_apk.outputs.apk_sha1 }}`
            - **Certificate SHA-256:** `${{ steps.pack_apk.outputs.apk_sha256 }}`

            ### 🛡️ Mã kiểm tra toàn vẹn File APK chống chỉnh sửa (File Checksum SHA-256)
            - **Release APK SHA-256:** `${{ steps.pack_apk.outputs.file_rel_sha256 }}`
            - **Debug APK SHA-256:** `${{ steps.pack_apk.outputs.file_dbg_sha256 }}`
          files: |
            ${{ steps.pack_apk.outputs.rel_apk }}
            ${{ steps.pack_apk.outputs.dbg_apk }}
            ${{ steps.pack_apk.outputs.rel_apk }}.sha256
            ${{ steps.pack_apk.outputs.dbg_apk }}.sha256
            version-manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
