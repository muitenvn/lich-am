name: Build and Release Signed APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Phiên bản phát hành (ví dụ: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    name: Build Synchronized APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập JDK 21 (Tương thích Gradle 9.3.1 & AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Thiết lập Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: 4. Cài đặt Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true

      - name: 5. Thiết lập Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Đồng bộ Chữ ký số (Debug & Release Keystore cùng chứng chỉ SHA-1/SHA-256)
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Đã khôi phục debug.keystore từ debug.keystore.base64"
          elif [ -n "$KEYSTORE_BASE64_SECRET" ]; then
            echo "$KEYSTORE_BASE64_SECRET" | base64 -d > debug.keystore
            echo "Đã khôi phục debug.keystore từ GitHub Secret KEYSTORE_BASE64"
          else
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Đồng bộ sang my-upload-key.jks (alias: upload) để bản Release và Debug có CÙNG 1 CHỮ KÝ SỐ
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -destkeystore my-upload-key.jks \
            -srcstoretype PKCS12 \
            -deststoretype PKCS12 \
            -srcstorepass android \
            -deststorepass android \
            -srckeypass android \
            -destkeypass android \
            -srcalias androiddebugkey \
            -destalias upload \
            -noprompt

          echo "=== Kiểm tra dấu vân tay chữ ký số (SHA-1 & SHA-256) ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: 7. Biên dịch APK (Release & Debug đã đồng bộ chữ ký)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ] && [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts || true
          fi
          gradle assembleRelease assembleDebug --no-daemon

      - name: 8. Xác thực chữ ký APK & Chuẩn bị file phát hành
        id: pack_apk
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          FINAL_REL="LichVanNien-${TAG_NAME}-release-signed.apk"
          FINAL_DBG="LichVanNien-${TAG_NAME}-debug-signed.apk"

          cp "$REL_APK" "$FINAL_REL"
          cp "$DBG_APK" "$FINAL_DBG"

          APK_SHA1=$(keytool -printcert -jarfile "$FINAL_REL" | grep -E "SHA1:|SHA-1:" | head -n 1 | awk '{print $2}')
          APK_SHA256=$(keytool -printcert -jarfile "$FINAL_REL" | grep -E "SHA256:|SHA-256:" | head -n 1 | awk '{print $2}')

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "rel_apk=$FINAL_REL" >> $GITHUB_OUTPUT
          echo "dbg_apk=$FINAL_DBG" >> $GITHUB_OUTPUT
          echo "apk_sha1=$APK_SHA1" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: 9. Lưu trữ APK trên GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LichVanNien-Signed-APKs-${{ steps.pack_apk.outputs.tag_name }}
          path: |
            ${{ steps.pack_apk.outputs.rel_apk }}
            ${{ steps.pack_apk.outputs.dbg_apk }}

      - name: 10. Tự động tạo bản phát hành trên GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack_apk.outputs.tag_name }}
          name: "Lịch Vạn Niên ${{ steps.pack_apk.outputs.tag_name }} (Signed APK)"
          body: |
            ## 🏮 Lịch Vạn Niên - Bản phát hành ${{ steps.pack_apk.outputs.tag_name }}
            File APK đã được tự động biên dịch và **đồng bộ chữ ký số (Signing Certificate)** giữa bản Release, bản Debug, AI Studio và Firebase Google Sign-In.

            ### 🔐 Thông tin Chữ ký số APK
            - **Package Name:** `com.aistudio.lichvannien.vnkpxr`
            - **SHA-1:** `${{ steps.pack_apk.outputs.apk_sha1 }}`
            - **SHA-256:** `${{ steps.pack_apk.outputs.apk_sha256 }}`
          files: |
            ${{ steps.pack_apk.outputs.rel_apk }}
            ${{ steps.pack_apk.outputs.dbg_apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
