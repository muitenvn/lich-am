name: Build & Publish Android APK to GitHub Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Phiên bản phát hành (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Tiêu đề bản phát hành'
        required: true
        default: 'Lịch Vạn Niên - Bản phát hành chính thức'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Giải mã Keystore (Debug/Release)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Biên dịch APK (Debug & Release)
        run: |
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Đổi tên file APK chuẩn phát hành
        id: rename_apk
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name }}"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          FINAL_APK="LichVanNien-${TAG_NAME}.apk"
          cp "$APK_PATH" "$FINAL_APK"
          echo "apk_file=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Tự động đăng APK lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename_apk.outputs.tag_name }}
          name: ${{ github.event.inputs.release_title || format('Lịch Vạn Niên {0}', steps.rename_apk.outputs.tag_name) }}
          body: |
            ## 🏮 Lịch Vạn Niên (${{ steps.rename_apk.outputs.tag_name }})
            - 🌙 Tra cứu Lịch Âm - Dương Việt Nam chính xác theo thuật toán thiên văn.
            - 🔔 Thông báo ngày lễ, Mùng 1, Rằm và nhắc nhở thông minh.
            - 🔄 Đổi ngày Âm ↔ Dương nhanh chóng.
            - ☁️ Đồng bộ Google Calendar & Sao lưu đám mây Firebase bảo mật.
            - 🤝 Chia sẻ lịch trình qua Email & mạng xã hội.
            - 📱 Hỗ trợ Widget màn hình chính & Chế độ tối tiết kiệm pin.
          files: ${{ steps.rename_apk.outputs.apk_file }}
          draft: false
          prerelease: false
